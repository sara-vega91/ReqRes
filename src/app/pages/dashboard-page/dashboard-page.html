<div class="dashboard-layout">
  <div class="nav-bar">
    <!-- navBar emite la sección que el usuario selecciona -->
    <app-nav-bar-component (sectionChange)="onSectionChange($event)" (logout)="onLogout()">
    </app-nav-bar-component>
  </div>

  <div class="main-content">
    <!-- lista + paginación -->

    <app-list-component
      (rowSelected)="onRowSelected($event)"
      [users]="users"
      [resources]="resources"
      [section]="currentSection"
    ></app-list-component>

    <app-pagination-component
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (nextPage)="onNextPage()"
      (prevPage)="onPreviousPage()"
    >
    </app-pagination-component>
  </div>

  <div class="edit-modal-card">
    @if (isEditModalOpen) {
      <app-edit-modal-component
        [item]="selectedItem"
        [section]="currentSection"
        (save)="onSaveEdit($event)"
        (cancel)="onCancelEdit()"
      ></app-edit-modal-component>
    }
  </div>
</div>
